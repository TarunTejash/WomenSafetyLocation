<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Women Safety Location</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial;text-align:center;margin-top:50px;">

<h1>Women Safety System</h1>

<h2 id="status">Press the button</h2>

<button onclick="getLocation()" style="padding:15px 30px;font-size:20px;">
Start Tracking
</button>

<h3 id="lat"></h3>
<h3 id="lon"></h3>

<script>
function getLocation(){

if(navigator.geolocation){

document.getElementById("status").innerHTML="Getting Location...";

navigator.geolocation.getCurrentPosition(function(position){

document.getElementById("status").innerHTML="Location Found";

document.getElementById("lat").innerHTML=
"Latitude : "+position.coords.latitude;

document.getElementById("lon").innerHTML=
"Longitude : "+position.coords.longitude;

});

}
else{

document.getElementById("status").innerHTML=
"Geolocation Not Supported";

}

}
</script>

</body>
</html>
