<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Women Safety Location</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body style="font-family:Arial;text-align:center;margin-top:50px;">

<h1>Women Safety System</h1>

<h2 id="status">Press the button</h2>

<button onclick="getLocation()" style="padding:15px 30px;font-size:20px;">
Start Tracking
</button>

<h3 id="lat"></h3>
<h3 id="lon"></h3>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyD6ZdjA43-HpNvI6EH75rIwToMomOrRALs",
  authDomain: "womensafetyproject-d57dc.firebaseapp.com",
  databaseURL: "https://womensafetyproject-d57dc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "womensafetyproject-d57dc",
  storageBucket: "womensafetyproject-d57dc.firebasestorage.app",
  messagingSenderId: "119765137642",
  appId: "1:119765137642:web:84eb3ee560bd1f2db03f93",
  measurementId: "G-TV7SFJJTCB"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
let watchId = null;

function getLocation() {

  if (!navigator.geolocation) {
    document.getElementById("status").innerHTML =
      "Geolocation Not Supported";
    return;
  }

  document.getElementById("status").innerHTML =
    "Getting Location...";

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(

    function(position) {

      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("status").innerHTML =
        "Live Tracking";

      document.getElementById("lat").innerHTML =
        "Latitude : " + lat;

      document.getElementById("lon").innerHTML =
        "Longitude : " + lon;

      console.log(lat, lon);
      db.ref("location").set({
      latitude: lat,
      longitude: lon,
      timestamp: Date.now()
      })
      .then(() => {
      console.log("Firebase Updated");
      })
      .catch((err) => {
      console.error(err);
      });

    },

    function(error) {
      document.getElementById("status").innerHTML =
        error.message;
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }

  );
}
</script>

</body>
</html>
